<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kıbrıs İlan - Gizli Yönetici Paneli</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
        import { getFirestore, collection, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAyYty49vBvMFPlgVCtruA2SdTF4RXqgGM",
            authDomain: "kibris-ilan-2b904.firebaseapp.com",
            projectId: "kibris-ilan-2b904",
            storageBucket: "kibris-ilan-2b904.firebasestorage.app",
            messagingSenderId: "747038151476",
            appId: "1:747038151476:web:005e2768dec5e40054cb61"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        
        window.db = db;
        window.colListings = collection(db, "listings");
        window.colStores = collection(db, "stores");
        window.colReports = collection(db, "reports");

        // ÇÖZÜM: EKSİK OLAN BAĞLANTILAR BURADA EKLENDİ
        window.getDocs = getDocs;
        window.deleteDoc = deleteDoc;
        window.doc = doc;

        onAuthStateChanged(auth, (user) => {
            if (user) {
                window.loadReports();
            } else {
                alert("Yönetici Paneline erişmek için oturum açmalısınız!");
                window.location.href = "login.html";
            }
        });
    </script>

    <style>
        :root { --primary: #F27A1A; --secondary: #1E293B; --bg: #F1F5F9; --white: #FFFFFF; --danger: #EF4444; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); display: flex; height: 100vh; overflow: hidden; }
        
        /* Sol Menü (Sidebar) */
        .sidebar { width: 260px; background: var(--secondary); color: white; display: flex; flex-direction: column; }
        .sidebar-header { padding: 20px; font-size: 18px; font-weight: 800; border-bottom: 1px solid #334155; color: var(--primary); display: flex; align-items: center; gap: 10px; }
        .nav-btn { background: none; border: none; color: #CBD5E1; padding: 16px 20px; text-align: left; font-size: 14px; font-weight: 600; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 12px; }
        .nav-btn:hover, .nav-btn.active { background: #0F172A; color: var(--primary); border-left: 4px solid var(--primary); }
        
        /* Ana İçerik */
        .main-content { flex: 1; overflow-y: auto; padding: 30px; }
        .header-title { font-size: 24px; font-weight: 800; color: var(--secondary); margin-bottom: 20px; }
        
        /* Tablolar */
        .admin-panel { display: none; background: var(--white); border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); padding: 20px; }
        .admin-panel.active { display: block; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 14px; text-align: left; border-bottom: 1px solid #E2E8F0; font-size: 13px; }
        th { background: #F8FAFC; color: var(--secondary); font-weight: 800; }
        
        /* Butonlar */
        .btn-action { padding: 6px 12px; border: none; border-radius: 6px; font-weight: 700; font-size: 11px; cursor: pointer; color: white; transition: 0.2s; }
        .btn-delete { background: var(--danger); }
        .btn-success { background: #10B981; }
        .btn-view { background: #3B82F6; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-header"><i class="fa-solid fa-shield-halved"></i> Kıbrıs İlan Admin</div>
        <button class="nav-btn active" onclick="switchTab('reportsTab', this)"><i class="fa-solid fa-triangle-exclamation"></i> Gelen Şikayetler</button>
        <button class="nav-btn" onclick="switchTab('storesTab', this)"><i class="fa-solid fa-store"></i> Mağaza Yönetimi</button>
        <button class="nav-btn" onclick="switchTab('listingsTab', this)"><i class="fa-solid fa-box-open"></i> Tüm İlanlar</button>
        <div style="margin-top:auto; padding:20px;">
            <button class="btn-action btn-delete" style="width:100%; padding:10px;" onclick="window.location.href='index.html'"><i class="fa-solid fa-arrow-left"></i> Siteye Dön</button>
        </div>
    </div>

    <div class="main-content">
        <!-- ŞİKAYETLER PANELİ -->
        <div id="reportsTab" class="admin-panel active">
            <div class="header-title">Kullanıcı Şikayetleri</div>
            <table>
                <thead><tr><th>Tarih</th><th>Şikayet Sebebi</th><th>Açıklama</th><th>Şikayet Eden</th><th>İşlem</th></tr></thead>
                <tbody id="reportsTableBody"><tr><td colspan="5"><i class="fa-solid fa-spinner fa-spin"></i> Veriler çekiliyor...</td></tr></tbody>
            </table>
        </div>

        <!-- MAĞAZALAR PANELİ -->
        <div id="storesTab" class="admin-panel">
            <div class="header-title">Sistemdeki Mağazalar</div>
            <table>
                <thead><tr><th>Mağaza Adı</th><th>Sahibi (Email)</th><th>Paket</th><th>Durum</th><th>İşlem</th></tr></thead>
                <tbody id="storesTableBody"><tr><td colspan="5"><i class="fa-solid fa-spinner fa-spin"></i> Veriler çekiliyor...</td></tr></tbody>
            </table>
        </div>

        <!-- İLANLAR PANELİ -->
        <div id="listingsTab" class="admin-panel">
            <div class="header-title">Sistemdeki Tüm İlanlar</div>
            <table>
                <thead><tr><th>İlan Başlığı</th><th>Fiyat</th><th>Satıcı</th><th>Durum</th><th>İşlem</th></tr></thead>
                <tbody id="listingsTableBody"><tr><td colspan="5"><i class="fa-solid fa-spinner fa-spin"></i> Veriler çekiliyor...</td></tr></tbody>
            </table>
        </div>
    </div>

    <script>
        function switchTab(tabId, btnElement) {
            document.querySelectorAll('.admin-panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            btnElement.classList.add('active');

            if (tabId === 'reportsTab') window.loadReports();
            if (tabId === 'storesTab') window.loadStores();
            if (tabId === 'listingsTab') window.loadAllListings();
        }

        window.loadReports = async function() {
            const tbody = document.getElementById('reportsTableBody');
            tbody.innerHTML = '<tr><td colspan="5"><i class="fa-solid fa-spinner fa-spin"></i> Veriler çekiliyor...</td></tr>';
            try {
                const snap = await window.getDocs(window.colReports);
                if(snap.empty) { 
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; color:gray;">Henüz hiçbir şikayet bulunmuyor. Harika! 🎉</td></tr>'; 
                    return; 
                }
                
                tbody.innerHTML = '';
                snap.forEach(docSnap => {
                    const r = docSnap.data();
                    const dateStr = new Date(r.timestamp).toLocaleString('tr-TR');
                    tbody.innerHTML += `
                        <tr>
                            <td>${dateStr}</td>
                            <td><strong style="color:red;">${r.reason}</strong></td>
                            <td>${r.description}</td>
                            <td>${r.reporterEmail}</td>
                            <td style="display:flex; gap:5px;">
                                <button class="btn-action btn-delete" onclick="deleteReport('${docSnap.id}')">Şikayeti Sil</button>
                                <button class="btn-action btn-view" onclick="deleteListing('${r.listingId}')">İlanı Kaldır</button>
                            </td>
                        </tr>
                    `;
                });
            } catch(e) { 
                console.error(e);
                tbody.innerHTML = `<tr><td colspan="5" style="color:red;">Firebase Hatası: ${e.message}</td></tr>`; 
            }
        };

        window.loadStores = async function() {
            const tbody = document.getElementById('storesTableBody');
            tbody.innerHTML = '<tr><td colspan="5"><i class="fa-solid fa-spinner fa-spin"></i> Veriler çekiliyor...</td></tr>';
            try {
                const snap = await window.getDocs(window.colStores);
                if(snap.empty) { 
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; color:gray;">Sistemde kayıtlı mağaza bulunmuyor.</td></tr>'; 
                    return; 
                }

                tbody.innerHTML = '';
                snap.forEach(docSnap => {
                    const s = docSnap.data();
                    tbody.innerHTML += `
                        <tr>
                            <td><strong>${s.name}</strong></td>
                            <td>${s.userEmail}</td>
                            <td><span style="background:#F59E0B; color:white; padding:3px 6px; border-radius:4px;">${s.packageName}</span></td>
                            <td>Aktif</td>
                            <td><button class="btn-action btn-delete" onclick="deleteStore('${docSnap.id}')">Kapat</button></td>
                        </tr>
                    `;
                });
            } catch(e) {
                console.error(e);
                tbody.innerHTML = `<tr><td colspan="5" style="color:red;">Firebase Hatası: ${e.message}</td></tr>`;
            }
        };

        window.loadAllListings = async function() {
            const tbody = document.getElementById('listingsTableBody');
            tbody.innerHTML = '<tr><td colspan="5"><i class="fa-solid fa-spinner fa-spin"></i> Veriler çekiliyor...</td></tr>';
            try {
                const snap = await window.getDocs(window.colListings);
                if(snap.empty) { 
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; color:gray;">Sistemde kayıtlı ilan bulunmuyor.</td></tr>'; 
                    return; 
                }

                tbody.innerHTML = '';
                snap.forEach(docSnap => {
                    const l = docSnap.data();
                    tbody.innerHTML += `
                        <tr>
                            <td><strong>${l.title}</strong></td>
                            <td>${l.price}</td>
                            <td>${l.sellerName} <br><span style="font-size:10px; color:gray;">${l.userEmail}</span></td>
                            <td>${l.status}</td>
                            <td><button class="btn-action btn-delete" onclick="deleteListing('${docSnap.id}')">Kaldır</button></td>
                        </tr>
                    `;
                });
            } catch(e) {
                console.error(e);
                tbody.innerHTML = `<tr><td colspan="5" style="color:red;">Firebase Hatası: ${e.message}</td></tr>`;
            }
        };

        
        window.deleteReport = async function(id) {
            if(!confirm("Bu şikayeti silmek istiyor musunuz?")) return;
            await window.deleteDoc(window.doc(window.db, "reports", id));
            window.loadReports();
        };

        window.deleteListing = async function(id) {
            if(!confirm("İlanı veritabanından kalıcı olarak silmek istiyor musunuz?")) return;
            await window.deleteDoc(window.doc(window.db, "listings", id));
            alert("İlan başarıyla silindi.");
            window.loadAllListings();
            window.loadReports(); 
        };

        window.deleteStore = async function(id) {
            if(!confirm("Mağazayı sistemden kalıcı olarak silmek istiyor musunuz?")) return;
            await window.deleteDoc(window.doc(window.db, "stores", id));
            alert("Mağaza başarıyla kapatıldı.");
            window.loadStores();
        };

// --- KURUMSAL MAĞAZA OLUŞTURMA VE ÖDEME SİHİRBAZI ---
        window.createNewStore = async function(event) {
            event.preventDefault();
            const activeUser = window.currentUser || window.auth.currentUser;
            if (!activeUser) {
                alert("Lütfen giriş yapın!"); window.location.href = 'login.html'; return;
            }
            if (!window.currentUser && activeUser) window.currentUser = activeUser;

            const name = document.getElementById('storeNameInput').value.trim();
            const sector = document.getElementById('storeSectorInput').value.trim();
            const city = document.getElementById('storeCityInput').value;
            const phone = document.getElementById('storePhoneInput').value.trim();
            const address = document.getElementById('storeAddressInput').value.trim();
            const desc = document.getElementById('storeDescInput').value.trim();
            const packageName = document.getElementById('selectedPackageName').value;
            const packagePrice = document.getElementById('selectedPackagePrice').value;

            if (!name || !sector || !phone || !address) {
                alert("Lütfen 2. adımdaki Mağaza Adı, Sektör, Telefon ve Adres bilgilerini eksiksiz doldurun!");
                window.goToWizardStep(2);
                return;
            }
            
            let selectedCategories = [];
            document.querySelectorAll('input[name="storeCat"]:checked').forEach(chk => { selectedCategories.push(chk.value); });
            if (selectedCategories.length === 0) selectedCategories = ["Emlak", "Vasıta"];

            pendingCheckoutData = {
                name, sector, city, phone, address, desc, packageName, categories: selectedCategories,
                userEmail: window.currentUser.email, logoUrl: tempStoreLogoBase64 || "", coverUrl: tempStoreCoverBase64 || "",
                initials: name.split(' ').map(w => w[0]).join('').substring(0, 2).toUpperCase(), verified: true, color: "#F27A1A",
                timestamp: Date.now()
            };
            
            activeCheckoutType = 'store_creation';
            document.getElementById('storePackagesModal').classList.remove('active');
            window.openCheckoutModal(`Kurumsal Mağaza - ${packageName} Paket`, packagePrice);
        };

        window.openCheckoutModal = function(productName, price) {
            document.getElementById('checkoutProductName').innerText = productName;
            document.getElementById('checkoutPriceText').innerText = price + " ₺";
            document.getElementById('checkoutBtnPrice').innerText = price + " ₺";
            
            document.getElementById('checkoutForm').reset();
            document.getElementById('checkoutModal').classList.add('active');
        };

        window.closeCheckoutModal = function() {
            document.getElementById('checkoutModal').classList.remove('active');
            pendingCheckoutData = null;
            activeCheckoutType = null;
        };

        window.processMockPayment = async function(event) {
            event.preventDefault();
            
            const btn = document.getElementById('btnCompletePayment');
            const originalText = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Banka Onayı Bekleniyor...';

            const currentType = activeCheckoutType;
            const currentData = pendingCheckoutData ? { ...pendingCheckoutData } : null;

            setTimeout(async () => {
                btn.innerHTML = '<i class="fa-solid fa-check-double"></i> Ödeme Başarılı!';
                btn.style.background = '#059669';

                setTimeout(async () => {
                    document.getElementById('checkoutModal').classList.remove('active');
                    btn.disabled = false;
                    btn.innerHTML = originalText;
                    btn.style.background = '#10B981';

                    if (currentType === 'store_creation' && currentData) {
                        try {
                            const docRef = await window.addDoc(window.colStores, currentData);
                            currentData.id = docRef.id;
                            currentLoggedInStore = currentData;
                            alert("Tebrikler! Ödemeniz başarıyla alındı. Kurumsal mağazanız açıldı ve Mavi Tik rozetiniz aktif edildi.");
                            await window.loadCloudData();
                            window.openMyStoreModal();
                        } catch(e) { 
                            alert("Ödeme alındı ancak mağaza oluşturulurken hata oluştu: " + e.message); 
                        }
                    } 
                    else if (currentType === 'vip_ad' && currentData) {
                        try {
                            const docRef = await window.addDoc(window.colListings, currentData);
                            currentData.id = docRef.id;
                            listings.unshift(currentData);
                            alert("Ödemeniz alındı! VIP İlanınız başarıyla vitrine eklendi.");
                            window.renderListings();
                            const postAdForm = document.querySelector('#postAdModal form');
                            if(postAdForm) postAdForm.reset();
                        } catch(e) { 
                            alert("İlan yayınlanırken hata oluştu: " + e.message); 
                        }
                    }
                    pendingCheckoutData = null;
                    activeCheckoutType = null;
                }, 1200);
            }, 2500);
        };

    </script>
</body>
</html>
